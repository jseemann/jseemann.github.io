<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Chatbot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-shape bg-shape-1"></div>
    <div class="bg-shape bg-shape-2"></div>

    <main class="app">
      <header class="topbar">
        <h1>Rewards Chatbot</h1>
      </header>

      <section id="authGate" class="auth-gate" aria-label="Access control">
        <p class="auth-copy">Enter password to use the chatbot.</p>
        <p class="auth-copy">Your API key is used only in this browser session and is not embedded in site code.</p>
        <form id="unlockForm" class="auth-form">
          <input id="accessPassword" type="password" placeholder="Password" autocomplete="off" required />
          <input id="runtimeApiKey" type="password" placeholder="OpenAI API key (sk-...)" autocomplete="off" required />
          <button class="btn" type="submit">Unlock</button>
        </form>
        <p id="authError" class="auth-error"></p>
      </section>

      <section id="messages" class="messages hidden" aria-live="polite"></section>

      <form id="chatForm" class="composer hidden">
        <textarea
          id="prompt"
          rows="1"
          placeholder="Ask me anything..."
          aria-label="Message"
          required
        ></textarea>
        <button id="sendButton" class="btn" type="submit">Send</button>
      </form>
    </main>

    <template id="messageTemplate">
      <article class="message">
        <span class="role"></span>
        <p class="content"></p>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
