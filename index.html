<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A Chatbot Made Especially For My Lovely Wife</title>
    <script>
      if (location.hostname === "jseemann.github.io") {
        location.replace(`https://rewards-chatbot.pages.dev${location.pathname}${location.search}${location.hash}`);
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-shape bg-shape-1"></div>
    <div class="bg-shape bg-shape-2"></div>

    <main class="app">
      <header class="topbar">
        <p class="eyebrow">Private Chat</p>
        <h1>A Chatbot Made Especially For My Lovely Wife</h1>
        <p class="subtitle">A cozy place for thoughtful chats, ideas, and smiles.</p>
      </header>

      <section id="authGate" class="auth-gate" aria-label="Access control">
        <div class="auth-art" aria-hidden="true">
          <span class="orb orb-a"></span>
          <span class="orb orb-b"></span>
          <span class="orb orb-c"></span>
        </div>
        <p class="auth-copy">Enter password to unlock your private chatbot.</p>
        <p class="auth-copy">Everything runs through secure server-side keys.</p>
        <form id="unlockForm" class="auth-form">
          <input id="accessPassword" type="password" placeholder="Husbands Name" autocomplete="off" required />
          <button class="btn" type="submit">Unlock</button>
        </form>
        <p id="authError" class="auth-error"></p>
      </section>

      <section id="messages" class="messages hidden" aria-live="polite"></section>

      <form id="chatForm" class="composer hidden">
        <textarea
          id="prompt"
          rows="1"
          placeholder="Ask me anything..."
          aria-label="Message"
          required
        ></textarea>
        <button id="sendButton" class="btn" type="submit">Send</button>
      </form>
    </main>

    <template id="messageTemplate">
      <article class="message">
        <span class="role"></span>
        <p class="content"></p>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
